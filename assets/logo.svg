<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#111827" stroke="#374151" stroke-width="6"/>
  <!-- Segmented context ring -->
  <circle cx="128" cy="128" r="64" stroke="#1F2937" stroke-width="20"/>
  <!-- Cyan: Tool calls (~42%) -->
  <circle cx="128" cy="128" r="64" stroke="#06B6D4" stroke-width="20" stroke-linecap="round"
    stroke-dasharray="165 402" stroke-dashoffset="0" transform="rotate(-90 128 128)"/>
  <!-- Violet: Thinking (~24%) -->
  <circle cx="128" cy="128" r="64" stroke="#8B5CF6" stroke-width="20" stroke-linecap="round"
    stroke-dasharray="88 402" stroke-dashoffset="-178" transform="rotate(-90 128 128)"/>
  <!-- Blue: System & Tools (~14%) -->
  <circle cx="128" cy="128" r="64" stroke="#3B82F6" stroke-width="20" stroke-linecap="round"
    stroke-dasharray="52 402" stroke-dashoffset="-280" transform="rotate(-90 128 128)"/>
  <!-- Green: User & Skills (~10%) -->
  <circle cx="128" cy="128" r="64" stroke="#22C55E" stroke-width="20" stroke-linecap="round"
    stroke-dasharray="36 402" stroke-dashoffset="-346" transform="rotate(-90 128 128)"/>
  <!-- Center pulse indicator -->
  <circle cx="128" cy="128" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="128" cy="128" r="8" fill="#38BDF8"/>
</svg>
